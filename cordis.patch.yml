# 阿哈酒馆 bundle 层：向 profile 注册两个酒馆模式。
# 每个模式是一份独立清单，只挂自己需要的插件；都不挂编码工具。
# 筹备模式自带联网搜索（MCP: open-websearch）。要关掉它，在自己 profile 的
# cordis.patch.yml 里整条覆盖 preset-tavern-setup（内嵌条目不能单独覆盖），
# plugins 里不写 mcp-websearch 那一条：见 examples/dev.example.yml 的说明。
#
# 提问卡片工具（tool-ask-user）只有筹备模式挂：主持人在建卡流程里用它让 user
# 挑已有的东西（host-setup 规则 2、11）。单聊与群聊不挂——这两个模式里要 user
# 选择的地方都由插件直接弹卡片（选角、开局、确认），模型看到的提问工具只会
# 被滥用来抢插件的事（比如没配生图服务时自己弹选画风的卡）。
#
# 每个模式还挂一个隔离的 compaction 服务组（长聊天的压缩对策）：宿主根层的
# 压缩后端在 web 界面下由各 preset 自备，酒馆模式不挂就完全没有压缩，长聊天
# 会撞上下文上限。组里的引擎是本包的 ./compaction 入口（继承宿主的
# BasicCompactionEngine，只把英文工程任务的摘要指令换成中文的扮演向剧情备忘）。
#
# 第一行是设置页：挂在根层的一行，包名即说明符（宿主只在这样的行上加载浏览器端），
# mode: settings 的实例不注册命令与工具，只给"插件"页里的设置页提供数据与启停。
# id 带插件前缀：根层行与宿主自己的行同在一张表里，撞名（如 settings）会让宿主的服务消失。
# 设置页只有用 dsh plugin add 安装时才会出现在"插件"页里；用 --patch 调试时看不到它。
- insert:
    - id: aha-tavern-settings
      name: aha-tavern
      config:
        mode: settings
    - id: preset-tavern-setup
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tavern-setup
        name: '酒馆:筹备'
        description: 开店、建角色卡、写主角档案、写世界观、导入。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是阿哈酒馆的主持人，只负责筹备，不是通用助手；怎么称呼自己、能做什么，以下文为准。
              includeRuntimeContext: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: aha-tavern
            name: aha-tavern
            config:
              mode: setup
          - id: mcp-websearch
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: websearch
              transport: stdio
              command: npx
              args: ['-y', 'open-websearch@2.2.0']
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-tavern
                name: 'aha-tavern/compaction'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
    - id: preset-tavern-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tavern-chat
        name: '酒馆:单聊'
        description: 和一个角色聊天。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是阿哈酒馆里的一员，不是通用助手：选定角色之前负责接待，之后扮演选定的角色；具体以下文为准。
              includeRuntimeContext: false
          - id: aha-tavern
            name: aha-tavern
            config:
              mode: chat
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-tavern
                name: 'aha-tavern/compaction'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
    - id: preset-tavern-group
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tavern-group
        name: '酒馆:群聊'
        description: 一群角色、有情景的群聊。
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是阿哈酒馆的一员，不是通用助手：开场之前负责张罗这一场，定下谁在场、什么情景之后，由旁白与在场角色接管；具体以下文为准。
              includeRuntimeContext: false
          - id: aha-tavern
            name: aha-tavern
            config:
              mode: group
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-tavern
                name: 'aha-tavern/compaction'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
