# 阿哈酒馆的外部服务配置示例。
# 复制到 <DSH_HOME>/aha-tavern/services.yaml（未设 DSH_HOME 时是 ~/.dsh/aha-tavern/services.yaml）。
# 分 image（生图）与 voice（语音）两节，各自独立：一节写错不影响另一节。
# 文件不存在，或某一节缺失 / 没有 endpoint，等同于没有配置那项服务。
# 每次用到时重新读取，改完不用重启；已经在聊的会话用 /aha 自检 让新配置生效。

image:
  endpoint: http://127.0.0.1:8188   # 必填：ComfyUI 的地址，没有这一项就是没配置
  workflow: qwen-image-2.1          # 内置工作流名，或工作流文件的绝对路径
  auto: true                        # 角色能否自己决定出图；false 时只响应用户要求
  style: 动漫风格插画，线条干净，光影柔和   # 拼在每个提示词最前面
  width: 832                        # 会向下取到 32 的倍数，不小于 256
  height: 1216
  steps: 12
  timeoutSeconds: 180               # 单张出图的等待上限
  # models:                         # 覆盖工作流里的默认模型文件名，按需填写
  #   unet: your-model.safetensors
  #   clip: your-text-encoder.safetensors
  #   vae: your-vae.safetensors

voice:
  endpoint: http://127.0.0.1:18123   # 必填：语音合成服务的地址（OpenAI 兼容接口，不用流式），没有这一项就是没配置；不要带用户名密码
  launch: none                       # mlx：允许插件在本机代为启动服务（endpoint 必须是本机地址）；none（默认）：只连接
  model: 0.6b                        # 0.6b（默认）、1.7b，或完整的模型名
  # modelsDir: ~/.dsh/aha-tavern/voice  # 运行环境与权重的存放目录；不写则用 <DSH_HOME>/aha-tavern/voice，须是绝对路径或 ~ 开头
  # hfEndpoint: https://hf-mirror.com   # 权重下载源；不写用官方
  read: lines                        # lines（默认）：只念台词，括号里的动作不念；all：整段都念（都会去掉图片行和 Markdown 标记）
  pauseSeconds: 2                    # 段间停顿（秒）：隔着大约 12 个没念出来的字时停多久，留时间看那些字；字多停久些，字少停短些；0 表示不停
  pauseMinSeconds: 1                 # 段间停顿最短多久（秒）
  pauseMaxSeconds: 4                 # 段间停顿最长多久（秒）；要满足 最短 ≤ pauseSeconds ≤ 最长，都在 0 到 10 之间
  language: chinese                  # 传给服务的语言
  timeoutSeconds: 120                # 单句合成最多等多少秒
